<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users Management | NexEvent</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Styling -->
    <link rel="stylesheet" href="css/style.css">
    <style>
        .users-header {
            padding: 8rem 0 4rem;
            text-align: center;
            background: linear-gradient(to bottom, rgba(108, 92, 231, 0.2), var(--bg-color));
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            color: white;
            background: var(--card-bg);
            border-radius: var(--border-radius);
            overflow: hidden;
            border: 1px solid var(--glass-border);
        }

        thead {
            background: rgba(108, 92, 231, 0.3);
        }

        th, td {
            padding: 1.2rem;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        th {
            font-weight: 600;
            color: var(--secondary-color);
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        tbody tr {
            transition: var(--transition);
        }

        tbody tr:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .btn-action {
            padding: 0.4rem 0.8rem;
            border: none;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            font-size: 0.9rem;
            transition: var(--transition);
            margin-right: 0.5rem;
            font-family: inherit;
        }

        .btn-update {
            background: #0984e3;
        }

        .btn-update:hover {
            background: #74b9ff;
        }

        .btn-delete {
            background: var(--accent-color);
        }

        .btn-delete:hover {
            background: #ff7675;
        }

        .empty-state {
            text-align: center;
            padding: 4rem;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <!-- Background -->
    <div class="bg-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <!-- Header -->
    <header id="header" class="scrolled">
        <div class="container nav-container">
            <a href="index.html" class="logo">
                <i class="fa-solid fa-bolt"></i> NexEvent
            </a>
            <nav class="nav-links" id="navLinks">
                <a href="home.html">Home</a>
                <a href="events.html">Events</a>
            </nav>
            <div class="nav-actions" style="display:flex; gap:1rem; align-items:center;">
                <a class="btn btn-outline" style="padding: 0.5rem 1.5rem">Log In</a>
                <button class="mobile-menu-btn" id="mobileMenuBtn">
                    <i class="fa-solid fa-bars"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Users Header -->
    <section class="users-header">
        <div class="container">
            <h1>User Management</h1>
            <p style="color: var(--text-secondary);">View and manage registered users.</p>
        </div>
    </section>

    <!-- Main Content -->
    <section class="section-padding" style="padding-top: 0; min-height: 50vh;">
        <div class="container">
            <div class="glass-panel" style="padding: 2rem;">
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Email</th>
                                <th style="text-align: right;">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="usersTableBody">
                            <!-- Users rendered by JS -->
                            <tr>
                                <td colspan="3" class="empty-state">Loading users...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="container" style="border-top: none; padding-top: 2rem;">
            <p style="text-align:center; color: var(--text-secondary);">&copy; 2026 NexEvent by Sarthak. All rights reserved.</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script>
        async function loadUsers() {
            const tableBody = document.getElementById('usersTableBody');
            
            try {
                const res = await fetch("http://localhost:8006/users");
                if (!res.ok) throw new Error("Failed to load users");
                
                const data = await res.json();
                
                if (data.length === 0) {
                    tableBody.innerHTML = '<tr><td colspan="3" class="empty-state">No users found.</td></tr>';
                    return;
                }
                
                tableBody.innerHTML = data.map(u => `
                    <tr>
                        <td style="font-weight: 500;">${u.name}</td>
                        <td style="color: var(--text-secondary);">${u.email}</td>
                        <td style="text-align: right;">
                            <button class="btn-action btn-update" onclick="upd('${u._id}')"><i class="fa-solid fa-pen-to-square"></i> Edit</button>
                            <button class="btn-action btn-delete" onclick="del('${u._id}')"><i class="fa-solid fa-trash"></i> Delete</button>
                        </td>
                    </tr>
                `).join('');
                
            } catch (err) {
                console.error(err);
                tableBody.innerHTML = '<tr><td colspan="3" class="empty-state"><i class="fa-solid fa-triangle-exclamation" style="color: var(--accent-color); font-size: 2rem; margin-bottom: 1rem;"></i><br>Failed to connect to backend API server on port 8006.<br>Make sure the backend is running.</td></tr>';
            }
        }

        async function del(id) {
            if(!confirm("Are you sure you want to delete this user?")) return;
            try {
                await fetch("http://localhost:8006/delete/" + id, { method: "DELETE" });
                loadUsers();
            } catch (err) { alert("Failed to delete user"); }
        }

        async function upd(id) {
            const newName = prompt("Enter new name (leave blank to keep current):");
            if(newName === null) return;
            
            try {
                await fetch("http://localhost:8006/update/" + id, { 
                    method: "PATCH",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify(newName ? { name: newName } : {})
                });
                loadUsers();
            } catch (err) { alert("Failed to update user"); }
        }

        document.addEventListener('DOMContentLoaded', loadUsers);
    </script>
</body>
</html>
